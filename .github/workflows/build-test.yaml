name: Build and Test

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  # Syntax-check the shell inside every workflow `run:` block. Most of the
  # release path is gated on `if: startsWith(github.ref, 'refs/tags/v')` and so
  # never runs on a PR; without this, a syntax error there ships green and only
  # surfaces when a tag is cut. See beads ovn-recon-sye.
  workflow-lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Lint shell in workflow run blocks
      run: python3 scripts/lint-workflows.py

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required for creating releases
      packages: write  # Optional, for future package publishing

    strategy:
      matrix:
        node-version: [18.x]

    steps:
    - uses: actions/checkout@v5

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v5
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Test
      run: npm run test

    - name: Build Asset
      run: npm run build

    - name: Set Release Metadata
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        VERSION=${GITHUB_REF#refs/tags/}
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        if [[ "$VERSION" == *"-"* ]]; then
          # Set pre-release images to expire in 30 days in Quay
          EXPIRY_TIME=$(date -d "30 days" +%s)
          echo "EXPIRY_LABEL=--label quay.expires-at=$EXPIRY_TIME" >> $GITHUB_ENV
        else
          echo "EXPIRY_LABEL=" >> $GITHUB_ENV
        fi

    - name: Set up QEMU
      if: startsWith(github.ref, 'refs/tags/v')
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      if: startsWith(github.ref, 'refs/tags/v')
      uses: docker/setup-buildx-action@v4

    - name: Login to Quay.io
      if: startsWith(github.ref, 'refs/tags/v')
      uses: docker/login-action@v4
      with:
        registry: quay.io
        username: ${{ secrets.QUAY_USER }}
        password: ${{ secrets.QUAY_TOKEN }}

    - name: Build and push console plugin image (multi-arch)
      if: startsWith(github.ref, 'refs/tags/v')
      env:
        DOCKER_BUILDX_NO_ISOLATED_BUILDER: "1"
      run: |
        set -euo pipefail
        echo "Building version $VERSION with $EXPIRY_LABEL"
        if [[ "$VERSION" != *"-"* ]]; then
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            $EXPIRY_LABEL \
            -t quay.io/dbewley/ovn-recon:$VERSION \
            -t quay.io/dbewley/ovn-recon:latest \
            --push .
        else
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            $EXPIRY_LABEL \
            -t quay.io/dbewley/ovn-recon:$VERSION \
            --push .
        fi

    - name: Verify console plugin image is a multi-arch manifest list
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        set -euo pipefail
        verify() {
          local img="$1"
          echo "---- verifying $img ----"
          local raw
          raw="$(docker buildx imagetools inspect "$img" --raw)"
          if ! echo "$raw" | jq -e '.manifests != null and (.manifests | length) > 1' >/dev/null; then
            echo "ERROR: $img is not a multi-arch manifest list (expected index with linux/amd64 and linux/arm64)."
            docker buildx imagetools inspect "$img" || true
            exit 1
          fi
          local plats
          plats="$(echo "$raw" | jq -r '.manifests[] | select(.platform != null) | "\(.platform.os)/\(.platform.architecture)"')"
          echo "$plats"
          echo "$plats" | grep -qx 'linux/amd64' || { echo "ERROR: missing linux/amd64 in $img"; exit 1; }
          echo "$plats" | grep -qx 'linux/arm64' || { echo "ERROR: missing linux/arm64 in $img"; exit 1; }
        }
        verify "quay.io/dbewley/ovn-recon:${VERSION}"
        if [[ "$VERSION" != *"-"* ]]; then
          verify "quay.io/dbewley/ovn-recon:latest"
        fi

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        generate_release_notes: true
        prerelease: ${{ contains(github.ref_name, '-') }}
        # Carried on every release until the tag is removed, so the deprecation
        # reaches people who read release notes rather than the repo docs.
        # Remove this block in the same change that stops publishing :v4.20.
        # Tracked in beads ovn-recon-09z.
        body: |
          > [!WARNING]
          > **`v1beta1` is the only served OvnRecon API version; `v1alpha1` remains declared only as an unserved placeholder.**
          >
          > `v1alpha1` has been unserved (unusable) since v0.3.1-b2, and the schemas were
          > identical, so update any manifests still declaring
          > `apiVersion: recon.bewley.net/v1alpha1` to `v1beta1`. It stays declared on the CRD
          > because clusters first installed at v0.2.2 or earlier still list it in the CRD's
          > `status.storedVersions`, and OLM refuses to apply a CRD that drops a listed stored
          > version. On startup this release rewrites every `OvnRecon` and clears the stale
          > entry, which lets a later release remove `v1alpha1` for good.
          >
          > If an upgrade still stalls with `risk of data loss updating "ovnrecons.recon.bewley.net":
          > new CRD removes version v1alpha1 that is listed as a stored version`, run the
          > migration by hand, then delete the failed InstallPlan so OLM re-resolves (a failed
          > plan is not retried on its own, even with automatic approval):
          >
          > ```
          > oc get ovnrecons.recon.bewley.net -A -o yaml | oc replace -f -
          > oc patch crd ovnrecons.recon.bewley.net --subresource=status --type=merge -p '{"status":{"storedVersions":["v1beta1"]}}'
          > oc delete installplan -n <operator-namespace> <failed-installplan>
          > ```
          >
          > Carried in release notes through the next few releases; details in OPERATOR.md.

          > [!IMPORTANT]
          > **Images follow the release's `RELATED_IMAGE_*` again, and `OvnRecon` defaults now live in the operator instead of the CRD schema.**
          >
          > Earlier CRDs declared `consolePlugin.image.repository` and `collector.image.repository`
          > as schema defaults, which the apiserver wrote into every object at creation. The
          > operator only consults `RELATED_IMAGE_PLUGIN` / `RELATED_IMAGE_COLLECTOR` when the
          > CR names no image, so that path was dead for every real object and mirrored
          > (oc-mirror) installs pulled the hardcoded `quay.io` repository. Fixed: the CRD
          > declares **no defaults at all**, and a repository equal to the built-in default is
          > treated as unset, so existing objects follow the release images again without editing.
          >
          > Consequences: an `OvnRecon` is stored exactly as written (an empty `spec` is a full
          > install), a changed default reaches existing objects on the next reconcile, and the
          > values the operator actually resolved are published under **`status.effective`**
          > (`oc get ovnrecon <name> -o jsonpath='{.status.effective}'`). Objects created under
          > earlier releases still carry whatever the old schema wrote into them, for example
          > `collector.enabled: false`, `managed: false` or `mode: EmptyDir`, and an explicit value
          > is honored. Remove the fields you want to follow the defaults:
          >
          > ```
          > oc patch ovnrecon <name> --type=json -p '[{"op":"remove","path":"/spec/collector/enabled"}]'
          > ```

          > [!IMPORTANT]
          > **`OvnRecon` defaults changed: a bare resource is now a fully functional install.**
          >
          > `consolePlugin.enabled`, `collector.cache.storage.managed` (new default `true`) and
          > `collector.cache.storage.mode` (new value and default `auto`: PVC with automatic
          > EmptyDir fallback + Warning event) now default on. Explicit values are always
          > honored — in particular `mode: EmptyDir` now **never** creates a PVC, even with
          > `managed: true`. Note for pre-existing resources: the old CRD materialized
          > `mode: EmptyDir` and `managed: false` into stored objects at creation, so existing
          > CRs keep their previous behavior — delete those fields (or the whole `storage`
          > block) to adopt the new defaults.
          >
          > All deprecated legacy alias fields have been **removed**: `spec.image.*` (use
          > `consolePlugin.image.*`), `spec.collectorImage.*` (use `collector.image.*`),
          > `spec.featureGates.ovn-collector` (use `collector.enabled`), and
          > `spec.collectorProbeNamespaces` (use `collector.probeNamespaces`). A resource still
          > setting only a removed field falls back to that setting's default — migrate any
          > remaining manifests to the hierarchical spelling.

          > [!IMPORTANT]
          > **The `bewley-operator-catalog:v4.20` catalog tag is deprecated and will be removed.**
          >
          > It no longer means anything: one file-based catalog now serves every supported
          > OpenShift version, so the tag does not select a 4.20-specific catalog and never did
          > after the FBC migration. It is currently published as an alias.
          >
          > Update your `CatalogSource` to whichever suits you:
          >
          > | Tag | Contains |
          > |---|---|
          > | `quay.io/dbewley/bewley-operator-catalog:stable` | stable releases only |
          > | `quay.io/dbewley/bewley-operator-catalog:latest` | every release, prereleases included |
          >
          > When `:v4.20` is removed it will be **deleted**, not merely left unpublished, so a
          > `CatalogSource` still pointing at it fails visibly instead of silently serving an
          > ever-staler catalog.
