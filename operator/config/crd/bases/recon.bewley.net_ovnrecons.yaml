---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: ovnrecons.recon.bewley.net
spec:
  group: recon.bewley.net
  names:
    kind: OvnRecon
    listKind: OvnReconList
    plural: ovnrecons
    singular: ovnrecon
  scope: Cluster
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Retired OvnRecon API version kept declared only so clusters that
          once stored objects as v1alpha1 can upgrade; it is not served. The operator
          clears it from status.storedVersions on startup. Use recon.bewley.net/v1beta1.
        type: object
        x-kubernetes-preserve-unknown-fields: true
    served: false
    storage: false
  - name: v1beta1
    schema:
      openAPIV3Schema:
        description: OvnRecon is the Schema for the ovnrecons API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              OvnReconSpec defines the desired state of OvnRecon.

              Every field is optional and an empty spec is a complete, working install.
              Defaults are applied by the operator at reconcile time, not by the CRD
              schema, so an omitted field stays omitted in the stored object and follows
              the operator's current default across upgrades. The values the operator
              actually resolved are published in status.effective.
            properties:
              collector:
                description: Collector configuration.
                properties:
                  cache:
                    description: Cache controls collector-side snapshot caching.
                    properties:
                      enabled:
                        description: Enabled toggles the snapshot cache. Defaults
                          to true.
                        type: boolean
                      storage:
                        description: Storage selects the volume backing the cache
                          directory.
                        properties:
                          claimName:
                            description: |-
                              ClaimName names an existing PersistentVolumeClaim to mount instead of
                              the managed claim. Ignored when mode is EmptyDir.
                            type: string
                          managed:
                            description: |-
                              Managed has the operator create and own the claim (RWO, owner-referenced
                              to the OvnRecon for garbage collection), so PVC caching needs no
                              pre-provisioned claim. Defaults to true; an explicit false removes a
                              previously managed claim. When claimName is empty a default of
                              "<collector>-cache" is used. Users who need RWX or special claim
                              settings should pre-create their own claim and set managed false.
                            type: boolean
                          mode:
                            description: |-
                              Mode selects the cache backing. auto (the default) uses a PVC — the
                              managed claim, or claimName — and falls back to EmptyDir with a
                              Warning event when the claim cannot be provisioned. EmptyDir forces
                              ephemeral storage and never creates or mounts a PVC, even with
                              managed true. PVC requires persistent storage and never falls back;
                              provisioning failures are surfaced instead.
                            enum:
                            - auto
                            - EmptyDir
                            - PVC
                            type: string
                          size:
                            description: |-
                              Size of the managed claim. Defaults to 1Gi: deliberately generous, the
                              cache needs only a few MiB, but some provisioners enforce minimum sizes.
                            type: string
                          storageClassName:
                            description: StorageClassName for the managed claim; empty
                              uses the cluster default.
                            type: string
                        type: object
                      ttlSeconds:
                        description: TTLSeconds is how long a cached zone snapshot
                          stays fresh. Defaults to 120.
                        format: int32
                        minimum: 30
                        type: integer
                    type: object
                  enabled:
                    description: |-
                      Enabled toggles logical topology features backed by the collector service.
                      Defaults to true; set false to disable the collector and the logical views.
                    type: boolean
                  image:
                    description: Image configuration for the OVN collector container
                      image.
                    properties:
                      pullPolicy:
                        description: |-
                          PullPolicy for the collector container. Defaults to the console
                          plugin's pull policy.
                        type: string
                      repository:
                        description: |-
                          Repository is the collector container image, without a tag. Leave it
                          unset to run the image the operator release declares
                          (RELATED_IMAGE_COLLECTOR, which mirrored installs rewrite); the built-in
                          fallback is quay.io/dbewley/ovn-collector.
                        type: string
                      tag:
                        description: |-
                          Tag overrides the image tag. Defaults to the console plugin's tag, so
                          the collector upgrades in lockstep with the plugin.
                        type: string
                    type: object
                  logging:
                    description: Logging controls for the collector service.
                    properties:
                      includeProbeOutput:
                        description: |-
                          IncludeProbeOutput logs the raw output of every ovn-nbctl/ovn-sbctl
                          probe command the collector runs. Verbose — each snapshot logs the
                          full northbound table dumps — so enable only while diagnosing
                          collection problems. Defaults to false.
                        type: boolean
                      level:
                        description: |-
                          Level sets the collector log verbosity. Defaults to info. At debug the
                          collector logs each probe command and cache decision; trace adds
                          per-request detail.
                        enum:
                        - error
                        - warn
                        - info
                        - debug
                        - trace
                        type: string
                    type: object
                  probeNamespaces:
                    description: |-
                      ProbeNamespaces defines namespaces where collector is allowed to probe OVN pods.
                      Defaults to openshift-ovn-kubernetes and openshift-frr-k8s.
                    items:
                      type: string
                    type: array
                type: object
              consolePlugin:
                description: ConsolePlugin configuration
                properties:
                  displayName:
                    description: |-
                      DisplayName is shown for the plugin in the console UI. Defaults to
                      "OVN Recon".
                    type: string
                  enabled:
                    description: |-
                      Enabled auto-registers the plugin in the Console operator configuration.
                      Defaults to true — the plugin appears in the console without further
                      action. Set false to deploy the plugin resources without registering.
                    type: boolean
                  image:
                    description: Image configuration for the plugin container.
                    properties:
                      pullPolicy:
                        description: PullPolicy for the plugin container. Defaults
                          to IfNotPresent.
                        type: string
                      repository:
                        description: |-
                          Repository is the plugin container image, without a tag. Leave it
                          unset to run the image the operator release declares (RELATED_IMAGE_PLUGIN,
                          which mirrored installs rewrite); the built-in fallback is
                          quay.io/dbewley/ovn-recon.
                        type: string
                      tag:
                        description: |-
                          Tag overrides the image tag. Defaults to the operator's own release
                          version, so the plugin upgrades in lockstep with the operator.
                        type: string
                    type: object
                  logging:
                    description: Logging controls for the console plugin backend.
                    properties:
                      accessLog:
                        description: AccessLog controls per-request access logging
                          in the plugin backend.
                        properties:
                          enabled:
                            description: |-
                              Enabled logs every HTTP request served by the plugin backend.
                              Defaults to false.
                            type: boolean
                        type: object
                      level:
                        description: Level sets the plugin backend's log verbosity.
                          Defaults to info.
                        enum:
                        - error
                        - warn
                        - info
                        - debug
                        type: string
                    type: object
                type: object
              operator:
                description: Operator configuration.
                properties:
                  logging:
                    description: Logging controls for the operator controller.
                    properties:
                      events:
                        description: Events controls Kubernetes Event behavior from
                          the operator.
                        properties:
                          dedupeWindow:
                            description: |-
                              DedupeWindow suppresses repeat events with the same reason within this
                              duration (Go duration syntax, e.g. "5m"). Defaults to 5m.
                            type: string
                          minType:
                            description: |-
                              MinType is the least severe Kubernetes Event type the operator emits:
                              Normal records routine reconcile progress, Warning restricts events to
                              problems. Defaults to Normal.
                            enum:
                            - Normal
                            - Warning
                            type: string
                        type: object
                      level:
                        description: Level sets the operator controller's log verbosity.
                          Defaults to info.
                        enum:
                        - error
                        - warn
                        - info
                        - debug
                        - trace
                        type: string
                    type: object
                type: object
              targetNamespace:
                description: |-
                  TargetNamespace is where the OVN Recon workload and Service are created.
                  Defaults to "ovn-recon" when omitted.
                minLength: 1
                type: string
            type: object
          status:
            description: OvnReconStatus defines the observed state of OvnRecon.
            properties:
              conditions:
                description: Conditions represent the latest available observations
                  of an object's state
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              effective:
                description: |-
                  Effective is the configuration the operator resolved and is acting on:
                  spec values where set, otherwise the operator's defaults and the images
                  the operator release declares. It is what an explicit spec would have to
                  say to reproduce the current behaviour, and the place to look when the
                  spec is sparse.
                properties:
                  collector:
                    description: Collector is the resolved collector configuration.
                    properties:
                      cache:
                        description: Cache is the resolved snapshot cache configuration.
                        properties:
                          backing:
                            description: |-
                              Backing is what the collector Deployment actually mounts, PVC or
                              EmptyDir, after any auto-mode fallback. Empty while the collector is
                              disabled.
                            type: string
                          claimName:
                            description: ClaimName is the PersistentVolumeClaim used
                              or created for the cache.
                            type: string
                          enabled:
                            description: Enabled reports whether snapshot caching
                              is on.
                            type: boolean
                          fallbackReason:
                            description: FallbackReason explains an auto-mode fallback
                              to EmptyDir.
                            type: string
                          managed:
                            description: Managed reports whether the operator creates
                              and owns the claim.
                            type: boolean
                          mode:
                            description: 'Mode is the requested backing: auto, EmptyDir
                              or PVC.'
                            type: string
                          size:
                            description: Size of the managed claim.
                            type: string
                          storageClassName:
                            description: StorageClassName of the managed claim; empty
                              means the cluster default.
                            type: string
                          ttlSeconds:
                            description: TTLSeconds is the freshness window after
                              the floor was applied.
                            format: int32
                            type: integer
                        required:
                        - enabled
                        - managed
                        - mode
                        - ttlSeconds
                        type: object
                      enabled:
                        description: Enabled reports whether the collector and logical
                          topology views run.
                        type: boolean
                      image:
                        description: Image is the full collector image reference the
                          Deployment runs.
                        type: string
                      includeProbeOutput:
                        description: IncludeProbeOutput reports whether raw probe
                          output is logged.
                        type: boolean
                      logLevel:
                        description: LogLevel of the collector.
                        type: string
                      probeNamespaces:
                        description: ProbeNamespaces the collector may exec into.
                        items:
                          type: string
                        type: array
                      pullPolicy:
                        description: PullPolicy of the collector container.
                        type: string
                    required:
                    - cache
                    - enabled
                    - image
                    - includeProbeOutput
                    - logLevel
                    - probeNamespaces
                    - pullPolicy
                    type: object
                  consolePlugin:
                    description: ConsolePlugin is the resolved console plugin configuration.
                    properties:
                      accessLog:
                        description: AccessLog reports whether per-request access
                          logging is on.
                        type: boolean
                      displayName:
                        description: DisplayName shown in the console.
                        type: string
                      enabled:
                        description: Enabled reports whether the plugin is registered
                          with the console.
                        type: boolean
                      image:
                        description: Image is the full plugin image reference the
                          Deployment runs.
                        type: string
                      logLevel:
                        description: LogLevel of the plugin backend.
                        type: string
                      pullPolicy:
                        description: PullPolicy of the plugin container.
                        type: string
                    required:
                    - accessLog
                    - displayName
                    - enabled
                    - image
                    - logLevel
                    - pullPolicy
                    type: object
                  observedGeneration:
                    description: ObservedGeneration is the spec generation these values
                      were resolved from.
                    format: int64
                    type: integer
                  operator:
                    description: |-
                      Operator is the resolved operator policy. Log and event policy follow
                      the primary OvnRecon, so these can differ from this object's spec.
                    properties:
                      eventDedupeWindow:
                        description: EventDedupeWindow suppresses repeat events with
                          the same reason.
                        type: string
                      eventMinType:
                        description: EventMinType is the least severe Kubernetes Event
                          type emitted.
                        type: string
                      logLevel:
                        description: LogLevel the operator controller runs at.
                        type: string
                    required:
                    - eventDedupeWindow
                    - eventMinType
                    - logLevel
                    type: object
                  targetNamespace:
                    description: TargetNamespace is where the workload runs.
                    type: string
                required:
                - collector
                - consolePlugin
                - observedGeneration
                - operator
                - targetNamespace
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
